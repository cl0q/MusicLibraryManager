<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Music Authorization</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: #0c0c12;
      color: #e8e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 40px;
      max-width: 400px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #fc3c44, #d42e8d);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 36px; height: 36px; fill: white; }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e8e8f0;
    }
    .status {
      font-size: 13px;
      color: #8888a0;
      margin-bottom: 24px;
      min-height: 20px;
    }
    .status.error { color: #fb7185; }
    .status.success { color: #34d399; }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #2a2a36;
      border-top-color: #d4940c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M23.994 6.124a9.23 9.23 0 00-.24-2.19c-.317-1.31-1.062-2.31-2.18-3.043a5.022 5.022 0 00-1.877-.726 10.496 10.496 0 00-1.564-.15c-.04-.003-.083-.01-.124-.013H5.986c-.152.01-.303.017-.455.026-.747.043-1.49.123-2.193.4-1.336.53-2.3 1.452-2.865 2.78-.192.448-.292.925-.363 1.408-.056.392-.088.785-.1 1.18 0 .032-.007.062-.01.093v12.223c.01.14.017.283.027.424.05.815.154 1.624.497 2.373.65 1.42 1.738 2.353 3.234 2.802.42.127.856.187 1.297.228.468.045.937.07 1.407.074 3.834.004 7.67.004 11.504 0 .5-.006.998-.03 1.494-.08.517-.05 1.022-.152 1.5-.374 1.19-.553 2.032-1.46 2.543-2.657.207-.484.328-.99.393-1.512.06-.478.088-.96.095-1.442.01-.837.003-1.673.003-2.51V6.124zM17.725 18.09c-.03.322-.094.637-.234.93-.375.783-1.03 1.16-1.857 1.27-.534.072-1.06.04-1.58-.076-.628-.14-1.228-.387-1.78-.722-.17-.103-.326-.224-.51-.353 0 .204.003.382 0 .56a3.578 3.578 0 01-.067.638 1.446 1.446 0 01-.333.67c-.27.3-.626.415-1.016.434-.36.018-.71-.028-1.048-.13-.786-.236-1.37-.733-1.705-1.49a2.598 2.598 0 01-.197-.835c-.05-.495.03-.972.21-1.43.286-.733.78-1.268 1.482-1.592.5-.23 1.028-.342 1.577-.367.22-.01.44 0 .663.012V9.203c0-.184.032-.362.11-.527.13-.274.354-.42.652-.42.07 0 .14.01.21.024l4.277.91c.263.057.468.195.578.447.053.12.076.252.076.387v6.36c.012.568.003 1.138-.108 1.706z"/></svg>
    </div>
    <h1>Apple Music</h1>
    <div id="spinner" class="spinner"></div>
    <p id="status" class="status">Initializing MusicKit...</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const devToken = params.get('devToken');
    const statusEl = document.getElementById('status');
    const spinnerEl = document.getElementById('spinner');

    function setStatus(text, type) {
      statusEl.textContent = text;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function hideSpinner() {
      spinnerEl.classList.add('hidden');
    }

    if (!devToken) {
      hideSpinner();
      setStatus('Error: No developer token provided.', 'error');
    } else {
      // Load MusicKit JS
      const script = document.createElement('script');
      script.src = 'https://js-cdn.music.apple.com/musickit/v3/musickit.js';
      script.setAttribute('data-web-components', '');
      script.onerror = function() {
        hideSpinner();
        setStatus('Failed to load MusicKit JS from Apple CDN. Please try again later.', 'error');
      };

      document.addEventListener('musickitloaded', async function() {
        try {
          setStatus('Configuring MusicKit...');

          await MusicKit.configure({
            developerToken: devToken,
            app: {
              name: 'MusicLibraryManager',
              build: '0.1.0'
            }
          });

          const music = MusicKit.getInstance();

          setStatus('Opening Apple ID sign-in...');

          const userToken = await music.authorize();

          if (!userToken) {
            hideSpinner();
            setStatus('Authorization was cancelled or returned no token.', 'error');
            return;
          }

          // Emit the user token back to the main window via Tauri events
          setStatus('Storing authorization...', 'success');

          if (window.__TAURI__) {
            const { emit } = await import('@tauri-apps/api/event');
            await emit('apple-music-auth-complete', { userToken: userToken });
          } else if (window.__TAURI_INTERNALS__) {
            // Tauri v2 uses __TAURI_INTERNALS__
            const { emit } = await import('@tauri-apps/api/event');
            await emit('apple-music-auth-complete', { userToken: userToken });
          }

          hideSpinner();
          setStatus('Connected! You can close this window.', 'success');

          // Auto-close after brief delay
          setTimeout(() => {
            try { window.close(); } catch(e) {}
          }, 1500);
        } catch (err) {
          hideSpinner();
          const msg = err && err.message ? err.message : String(err);
          setStatus('Authorization failed: ' + msg, 'error');
          console.error('Apple Music auth error:', err);
        }
      });

      document.head.appendChild(script);
    }
  </script>
</body>
</html>

name: MLMMobile
options:
  bundleIdPrefix: com.musiclibrarymanager
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

targets:
  MLMMobile:
    type: application
    platform: iOS
    sources:
      - MLMMobile
    settings:
      base:
        INFOPLIST_FILE: MLMMobile/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.musiclibrarymanager.mlmmobile
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: GRDB

  MLMMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MLMMobileTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musiclibrarymanager.mlmmobile.tests
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: MLMMobile
      - package: GRDB

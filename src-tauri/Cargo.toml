[package]
name = "music-library-manager"
version = "0.1.0"
description = "Unified music library manager with streaming service aggregation"
authors = ["olli"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "music_library_manager"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
log = "0.4"
tracing = "0.1"

# Database
rusqlite = { version = "0.34", features = ["bundled"] }

# Audio metadata
lofty = "0.22"

# Full-text search
tantivy = "0.22"

# Fuzzy matching
strsim = "0.11"

# Regex for string normalization
regex = "1"

# Progress indication (for CLI/logging)
indicatif = "0.17"

# Path sanitization
sanitize-filename = "0.6"

# Error handling
thiserror = "2"
anyhow = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# OAuth token management
oauth2 = "5.0"
keyring = "3.6"
unicode-normalization = "0.1"

# Environment configuration
dotenvy = "0.15"

# HTTP client (for download infrastructure)
reqwest = { version = "0.12", features = ["json", "stream"] }
backoff = { version = "0.4", features = ["tokio"] }

# Streaming utilities
futures-util = "0.3"

# Audio codec detection (for transcode decision logic)
symphonia = { version = "0.5.5", features = ["all"] }

# File checksums for sync state tracking
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.24.0"
